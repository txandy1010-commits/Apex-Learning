<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Academic Hub | Owner Control Panel</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.75rem;
      color: var(--primary);
    }

    .back-btn {
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .back-btn:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .refresh-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .refresh-btn:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 0.75rem 0.5rem;
      border-bottom: 2px solid var(--border);
      color: #64748b;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.85rem 0.5rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }

    .badge-role {
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #475569;
    }

    #accessDenied {
      display: none;
      text-align: center;
      padding: 4rem 2rem;
    }

    #accessDenied h2 {
      color: var(--danger);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Access Denied Message -->
  <div id="accessDenied" class="container">
    <div class="card">
      <h2>Access Restricted</h2>
      <p>This panel is reserved exclusively for owner accounts.</p>
      <br>
      <a href="index.html" class="back-btn">&larr; Return to Main Portal</a>
    </div>
  </div>

  <!-- Main Owner Dashboard -->
  <div id="ownerContent" class="container" style="display: none;">
    <div class="header">
      <h1>Owner Control Panel</h1>
      <a href="index.html" class="back-btn">&larr; Return to Main Portal</a>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Live Active Sessions</h2>
        <button class="refresh-btn" onclick="loadActiveUsers()">Refresh Now</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Current Page</th>
            <th>Last Active</th>
          </tr>
        </thead>
        <tbody id="activeUsersTableBody">
          <tr>
            <td colspan="4" style="color: #94a3b8;">Loading active user data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. Authorization Check (Runs immediately)
    const isOwner = localStorage.getItem('isOwner') === 'true';

    if (!isOwner) {
      document.getElementById('accessDenied').style.display = 'block';
    } else {
      document.getElementById('ownerContent').style.display = 'block';
      loadActiveUsers();
      setInterval(loadActiveUsers, 10000); // Auto-refresh active users every 10 seconds
    }

    // 2. Fetch Active Users from Vercel Serverless API
    async function loadActiveUsers() {
      if (!isOwner) return;

      try {
        const response = await fetch('/api/active-users');
        const data = await response.json();

        if (response.ok && data.success) {
          const tableBody = document.getElementById('activeUsersTableBody');

          if (data.users.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" style="color: #94a3b8;">No active users right now.</td></tr>';
            return;
          }

          tableBody.innerHTML = data.users.map(user => {
            const timeAgo = Math.round((new Date() - new Date(user.last_seen)) / 1000);
            return `
              <tr>
                <td style="font-weight: 600;">${user.username}</td>
                <td><span class="badge-role">${user.role}</span></td>
                <td><code>${user.current_page || '/'}</code></td>
                <td style="color: #64748b;">${timeAgo}s ago</td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error('Failed to load active users:', err);
      }
    }

    // 3. Heartbeat script to record the owner's presence on this page
    function sendHeartbeat() {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const username = localStorage.getItem('loggedUser');
      const role = localStorage.getItem('role');

      if (isLoggedIn && username) {
        fetch('/api/heartbeat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: username, 
            role: role,
            page: window.location.pathname
          })
        }).catch(err => console.error('Heartbeat failed', err));
      }
    }

    sendHeartbeat();
    setInterval(sendHeartbeat, 30000); // Ping every 30 seconds
  </script>
</body>
</html>
