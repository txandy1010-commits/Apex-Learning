<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Owner Page</title>

  <!-- ACCESS CONTROL SCRIPT -->
  <script>
    (function verifyPageAccess() {
      const username = (localStorage.getItem('loggedUser') || '').toLowerCase();
      const roles = JSON.parse(localStorage.getItem('role') || '[]').map(r => String(r).toLowerCase());

      const isGuest111 = username === 'guest111';
      const isOwner = roles.includes('owner');

      if (!isGuest111 && !isOwner) {
        alert('Access Denied: Restricted page.');
        window.location.href = 'index.html';
      }
    })();
  </script>
