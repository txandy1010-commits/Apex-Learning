<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Academic Hub | Portal Authentication</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .login-card h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .login-card p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Portal Login</h2>
    <p>Sign in to access secure session features</p>
    
    <form id="loginForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required placeholder="Enter username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
      <div id="errorMsg" class="error-msg">Invalid username or password.</div>
    </form>

    <a href="index.html" class="back-link">&larr; Return to Main Portal</a>
  </div>

  <script>
  async function handleFormSubmit(event) {
    event.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    // Reset UI state
    errorMsg.style.display = 'none';
    submitBtn.innerText = 'Signing in...';
    submitBtn.disabled = true;

    try {
      // Send credentials securely to your Vercel backend function
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ username, password }),
      });

      const result = await response.json();

      if (response.ok && result.success) {
        // Save user role and name to local storage based on database response
        const role = result.user.role;
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('loggedUser', result.user.username);
        localStorage.setItem('role', role);
        localStorage.setItem('isAdmin', (role === 'admin' || role === 'owner') ? 'true' : 'false');
        localStorage.setItem('isOwner', (role === 'owner') ? 'true' : 'false');

        // Redirect to main portal
        window.location.href = "index.html";
      } else {
        errorMsg.innerText = result.message || 'Invalid username or password.';
        errorMsg.style.display = 'block';
      }
    } catch (error) {
      errorMsg.innerText = 'Server connection error. Please try again.';
      errorMsg.style.display = 'block';
    } finally {
      submitBtn.innerText = 'Sign In';
      submitBtn.disabled = false;
    }
  }
  </script>
  <script>
  function sendHeartbeat() {
    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
    const username = localStorage.getItem('loggedUser');
    const role = localStorage.getItem('role');

    if (isLoggedIn && username) {
      fetch('/api/heartbeat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          username: username, 
          role: role,
          page: window.location.pathname // Automatically grabs the current page path
        })
      }).catch(err => console.error('Heartbeat failed', err));
    }
  }

  sendHeartbeat();
  setInterval(sendHeartbeat, 30000);
</script>
  <!-- Put this right before </body> in index.html -->
  <script>
    function sendGlobalHeartbeat() {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const username = localStorage.getItem('loggedUser');
      const role = localStorage.getItem('role');

      if (isLoggedIn && username) {
        fetch('/api/heartbeat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            role: role,
            page: window.location.pathname
          })
        })
        .then(res => res.json())
        .then(data => {
          // If the owner clicked "Kick", kick them out immediately
          if (data.revoked) {
            localStorage.clear();
            alert('Your session has been terminated by an administrator.');
            window.location.href = 'index.html';
          }
        })
        .catch(err => console.error('Heartbeat check failed:', err));
      }
    }

    // Run immediately on page load, then every 15 seconds
    sendGlobalHeartbeat();
    setInterval(sendGlobalHeartbeat, 15000);
  </script>
</body>
</html>
</body>
</html>
