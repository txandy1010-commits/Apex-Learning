<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Academic Hub | Portal Authentication</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .login-card h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .login-card p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Portal Login</h2>
    <p>Sign in to access secure session features</p>
    
    <form id="loginForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required placeholder="Enter username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
      <div id="errorMsg" class="error-msg">Invalid username or password.</div>
    </form>

    <a href="index.html" class="back-link">&larr; Return to Main Portal</a>
  </div>

  <script>
  function handleFormSubmit(event) {
    event.preventDefault();

    // Convert inputs to lowercase for case-insensitive matching
    const user = document.getElementById('username').value.toLowerCase();
    const pass = document.getElementById('password').value.toLowerCase();
    const errorMsg = document.getElementById('errorMsg');

    // Helper function to set session storage
    function setSession(username, role) {
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('loggedUser', username);
      localStorage.setItem('role', role); // 'owner', 'admin', or 'user'
      
      localStorage.setItem('isAdmin', (role === 'admin' || role === 'owner') ? 'true' : 'false');
      localStorage.setItem('isOwner', (role === 'owner') ? 'true' : 'false');
      
      window.location.href = "index.html";
    }

    // --- OWNER ACCOUNTS ---
    // Fixed: 'Andy1010!' changed to lowercase 'andy1010!'
    if (user === "txandy10" && pass === "andy1010!") {
      setSession('Owner', 'owner');
    }
    
    // --- ADMIN ACCOUNTS ---
    else if (user === "admin" && pass === "admin") {
      setSession('admin', 'admin');
    }
    // Fixed: 'gray(14)' is already lowercase
    else if (user === "jerm14" && pass === "gray(14)") {
      setSession('Jurney', 'admin');
    }
    else if (user === "dusty1956" && pass === "heypikmin1956") {
      setSession('RJ', 'admin');
    }
    else if (user === "guest111" && pass === "12345sesamestreet12345") {
      setSession('oscar', 'admin');
    }
    else if (user === "admin" && pass === "guest") {
      setSession('guestadmin', 'admin');
    }
      else if (user === "Sangthafake676767" && pass === "fakesangtha") {
      setSession('sangtha', 'admin');
      }

    // --- REGULAR ACCOUNTS ---
    else if (user === "guest" && pass === "guest") {
      setSession('guest', 'user');
    }

    else {
      errorMsg.style.display = 'block';
    }
  }
</script>
</body>
</html>
