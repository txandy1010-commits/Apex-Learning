<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Academic Hub | Portal Authentication</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .login-card h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .login-card p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Portal Login</h2>
    <p>Sign in to access secure session features</p>
    
    <form id="loginForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required placeholder="Enter username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
      <div id="errorMsg" class="error-msg">Invalid username or password.</div>
    </form>

    <a href="index.html" class="back-link">&larr; Return to Main Portal</a>
  </div>

  <script>
    function handleFormSubmit(event) {
      event.preventDefault();

      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (user === "admin" && pass === "admin") {
        // Store admin login session
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'true');
        localStorage.setItem('loggedUser', 'admin');
        window.location.href = "index.html";
      } else if (user === "guest" && pass === "guest") {
        // Store guest/regular user login session
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'false');
        localStorage.setItem('loggedUser', 'guest');
        window.location.href = "index.html";
      } 
        else if (user === "Jerm14" && pass === "Gray(14)") {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'false');
        localStorage.setItem('loggedUser', 'Jurney');
        window.location.href = "index.html";
      }
          else if (user === "Dusty1956" && pass === "HeyPikmin1956") {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'true');
        localStorage.setItem('loggedUser', 'RJ');
        window.location.href = "index.html";
      }
            else if (user === "guest111" && pass === "12345sesamestreet12345") {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'true');
        localStorage.setItem('loggedUser', 'oscar');
        window.location.href = "index.html";
      }
      /* 
      ===================================================================
      TEMPLATE FOR ADDING NEW USERS (Copy & paste into the chain above)
      ===================================================================

      --- To add another ADMIN user: ---
      else if (user === "NEW_ADMIN_USER" && pass === "NEW_ADMIN_PASS") {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'true');
        localStorage.setItem('loggedUser', 'user');
        window.location.href = "index.html";
      }

      --- To add another REGULAR user: ---
      else if (user === "NEW_REGULAR_USER" && pass === "NEW_REGULAR_PASS") {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdmin', 'false');
        localStorage.setItem('loggedUser', 'user');
        window.location.href = "index.html";
      }
      ===================================================================
      */
      else {
        errorMsg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
